<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculator">
    <h2>Calculator</h2>

    <section class="display">
      <div id="expression"></div>
      <input type="text" id="screen" value="0" readonly aria-label="Calculator display">
    </section>

    <section class="buttons">
      <button class="utility" data-action="clear">C</button>
      <button class="utility" data-action="delete">⌫</button>
      <button class="operator" data-value="%">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="utility" data-action="sign">+/−</button>
      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equal" data-action="calculate">=</button>
    </section>

    <p class="hint">Keyboard supported · C to clear · Enter to calculate</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
